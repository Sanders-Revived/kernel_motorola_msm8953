name: build sanders 4.19

on:
  push:
    branches:
      - sanders/4.19.325-WIP
    paths:
      - arch/arm64/configs/vendor/sanders.config
      - arch/arm64/boot/dts/qcom/Makefile
      - arch/arm64/boot/dts/qcom/*sanders*
      - arch/arm64/boot/dts/qcom/dsi-panel-mot-*
      - arch/arm64/configs/sanders*_defconfig
      - .github/workflows/build-sanders.yml
  pull_request:
    paths:
      - arch/arm64/configs/vendor/sanders.config
      - arch/arm64/boot/dts/qcom/Makefile
      - arch/arm64/boot/dts/qcom/*sanders*
      - arch/arm64/boot/dts/qcom/dsi-panel-mot-*
      - arch/arm64/configs/sanders*_defconfig
      - .github/workflows/build-sanders.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies
        run: |
          sudo apt-get update -yqq
          sudo apt-get install -yqq bc bison device-tree-compiler flex \
            gcc-aarch64-linux-gnu libssl-dev lz4 make python3

      - name: defconfig
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- vendor/msm8953-perf_defconfig
          ./scripts/kconfig/merge_config.sh -m .config \
            arch/arm64/configs/vendor/mi8953.config \
            arch/arm64/configs/vendor/sanders.config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- savedefconfig
          cp defconfig canonical-sanders_defconfig

      - name: verify lineage defconfigs
        run: |
          cp .config canonical.config
          make O="$PWD/out-lineage" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- sanders_defconfig
          make O="$PWD/out-lineage" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          python3 scripts/diffconfig canonical.config out-lineage/.config \
            | tee lineage-config.diff
          test ! -s lineage-config.diff
          make O="$PWD/out-recovery" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- sanders_recovery_defconfig
          make O="$PWD/out-recovery" ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          grep -q '^CONFIG_TOUCHSCREEN_FTS=y$' canonical.config
          grep -q '^CONFIG_SENSORS_FPC_1020=m$' canonical.config
          grep -q '^CONFIG_INPUT_QTI_HAPTICS=y$' canonical.config
          grep -q '^CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE_NAMES=.*sanders-p4"$' canonical.config
          grep -q '^CONFIG_NO_TECHPACK_AUDIO=y$' canonical.config
          grep -q '^# CONFIG_MSM_CAMERA is not set$' canonical.config
          grep -q '^# CONFIG_PRONTO_WLAN is not set$' canonical.config
          grep -q '^# CONFIG_MACH_XIAOMI_MSM8953 is not set$' canonical.config


      - name: build image and dtbs
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc) Image.gz modules dtbs
          test -f drivers/input/misc/fpc1020_tee.ko

      - name: verify sanders dtbs
        run: |
          ls -la arch/arm64/boot/dts/qcom/msm8953-motorola-sanders-p?.dtb

      - name: build qcdt image
        run: |
          git clone --depth 1 --branch lineage-18.1 \
            https://github.com/LineageOS/android_system_tools_dtbtool.git dtbtool
          gcc -O2 -o dtbToolLineage dtbtool/dtbtool.c
          ./dtbToolLineage -o dt.img -s 2048 -p "$PWD/scripts/dtc/" \
            arch/arm64/boot/
          lz4 -9 -f dt.img dt.img.lz4
          test "$(od -An -tx1 -N4 dt.img | tr -d ' \n')" = "51434454"

      - name: upload qcdt image
        uses: actions/upload-artifact@v4
        with:
          name: sanders-419-qcdt
          path: dt.img.lz4
          if-no-files-found: error

      - name: upload image
        uses: actions/upload-artifact@v4
        with:
          name: sanders-419-image
          path: arch/arm64/boot/Image.gz
          if-no-files-found: error

      - name: upload build config and fingerprint module
        uses: actions/upload-artifact@v4
        with:
          name: sanders-419-build-data
          path: |
            canonical.config
            canonical-sanders_defconfig
            lineage-config.diff
            drivers/input/misc/fpc1020_tee.ko
          if-no-files-found: error

      - name: upload sanders dtbs
        uses: actions/upload-artifact@v4
        with:
          name: sanders-419-dtbs
          path: arch/arm64/boot/dts/qcom/msm8953-motorola-sanders-p?.dtb
          if-no-files-found: error
