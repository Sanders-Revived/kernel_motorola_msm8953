name: Aurora-Kernel

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Kernel branch to build'
        required: true
        default: '4.9.337'
        type: choice
        options:
          - 4.9.337
          - SDM632-WIP
      ksu_ref:
        description: 'BakaSU version (branch, tag or commit). E.g. main'
        required: false
        default: 'main'
        type: string

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: oc-ksu
            label: OC + KSU
            with_ksu: '1'
            with_oc: '1'
          - variant: oc-vanilla
            label: OC + vanilla
            with_ksu: '0'
            with_oc: '1'
          - variant: stock-ksu
            label: Stock GPU + KSU
            with_ksu: '1'
            with_oc: '0'
          - variant: vanilla
            label: Stock GPU + vanilla
            with_ksu: '0'
            with_oc: '0'

    env:
      DEVICE: sanders
      DEVICE_NAME: Moto G5s Plus
      KERNEL_NAME: Aurora Kernel

    steps:
      - name: Check Out (${{ inputs.branch }})
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.branch }}

      - name: Set Timezone
        uses: szenius/set-timezone@v1.2
        with:
          timezoneLinux: "America/Sao_Paulo"

      - name: Setting up the environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Set Build Start Time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Run build script
        env:
          WITH_KSU: ${{ matrix.with_ksu }}
          WITH_OC: ${{ matrix.with_oc }}
          KSU_REF: ${{ inputs.ksu_ref }}
        run: |
          echo "Variant: ${{ matrix.label }}"
          echo "Branch: ${{ inputs.branch }} | WITH_KSU=$WITH_KSU | WITH_OC=$WITH_OC | KSU_REF=$KSU_REF"
          ./build.sh

      - name: Set Build End Time
        run: echo "END_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Calculate Build Duration
        run: |
          duration=$((END_TIME - START_TIME))
          minutes=$((duration / 60))
          seconds=$((duration % 60))
          echo "BUILD_DURATION=${minutes}m ${seconds}s" >> $GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Kernel-${{ matrix.variant }}
          path: Aurora-Kernel-sanders*.zip
          if-no-files-found: error

      - name: Upload to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          document: Aurora-Kernel-sanders*.zip
          message: |
            🌌 New Aurora Kernel build available!
            📱 Device: Moto G5s Plus (sanders)
            🌿 Branch: ${{ inputs.branch }}
            📦 Variant: ${{ matrix.label }}
            🛡 KSU: ${{ matrix.with_ksu == '1' && 'with KSU' || 'without KSU' }} (${{ inputs.ksu_ref }})
            ⚡ GPU: ${{ matrix.with_oc == '1' && '725MHz OC' || 'stock' }}
            ⏱ Build time: ${{ env.BUILD_DURATION }}
